function fx(cv){const g=cv.getContext('2d');let P=[],N=[],on=0,W=0,H=0,D=Math.min(devicePixelRatio||1,2);
const rs=()=>{W=cv.clientWidth;H=cv.clientHeight;cv.width=W*D;cv.height=H*D;g.setTransform(D,0,0,D,0,0)},HU=[210,200,225,45,190,215];
function burst(x,y,n=80){const h=HU[Math.random()*6|0];for(let i=0;i<n;i++){const a=Math.random()*6.283,s=.6+Math.random()*5;N.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,l:1,d:.007+Math.random()*.012,r:1+Math.random()*1.8,c:`hsl(${h+Math.random()*24-12},95%,${68+Math.random()*22}%)`})}go()}
function rocket(x,y){N.push({x:x+(Math.random()-.5)*80,y:H||innerHeight,vx:0,vy:-(7+Math.random()*3),ty:y||(H||innerHeight)*(.15+Math.random()*.35),k:1,l:1,d:0,r:2,c:'#fff'});go()}
function go(){if(!on){on=1;rs();requestAnimationFrame(tick)}}
function tick(){g.globalCompositeOperation='destination-out';g.fillStyle='rgba(0,0,0,.2)';g.fillRect(0,0,W,H);g.globalCompositeOperation='lighter';P=P.concat(N);N=[];
P=P.filter(p=>{if(p.k){p.y+=p.vy;p.vy*=.985;if(p.y<=p.ty||p.vy>-1.2){burst(p.x,p.y,90);return 0}}else{p.vx*=.985;p.vy=p.vy*.985+.05;p.x+=p.vx;p.y+=p.vy;p.l-=p.d}
g.globalAlpha=Math.max(p.l,0);g.fillStyle=p.c;g.beginPath();g.arc(p.x,p.y,p.r,0,6.283);g.fill();return p.l>0});
g.globalAlpha=1;if(P.length||N.length)requestAnimationFrame(tick);else{on=0;g.clearRect(0,0,W,H)}}
addEventListener('resize',()=>on&&rs());return{burst,rocket}}

const F=fx($('#fx')),R=()=>F.rocket(innerWidth*(.1+Math.random()*.8));
const T=[['carta','💌','Carta'],['tarta','🎂','Tarta'],['globos','🎈','Globos'],['regalo','🎁','Regalo'],['memoria','🌸','Memoria'],['fuegos','🎆','Fuegos'],['deseos','🏮','Deseos']];
const dec=b=>new TextDecoder().decode(Uint8Array.from(atob(b),c=>c.charCodeAt(0)));const vis=new Set();let z=1;
T.forEach(([k,e,n])=>{const f=document.createElement('iframe');f.id='f-'+k;f.title=n;f.setAttribute('sandbox','allow-scripts');$('#st').appendChild(f);
const b=document.createElement('button');b.id='b-'+k;b.innerHTML=`<span>${e}</span>${n}`;b.onclick=()=>ir(k);$('#nav').appendChild(b)});
$('#nav').insertAdjacentHTML('beforeend','<button id="b-fin" hidden><span>💙</span>Final</button>');
function pill(b){const p=$('#pl');p.style.width=b.offsetWidth+'px';p.style.transform=`translateX(${b.offsetLeft}px)`}
function ir(k){const f=$('#f-'+k),b=$('#b-'+k),r=b.getBoundingClientRect();if(!f.srcdoc)f.srcdoc=dec(D[k]);
f.style.setProperty('--cx',r.left+r.width/2+'px');f.style.setProperty('--cy',r.top+'px');f.style.zIndex=++z;
const old=[...document.querySelectorAll('iframe.on')];f.classList.add('on');setTimeout(()=>old.forEach(o=>o!==f&&o.classList.remove('on')),1000);
T.forEach(([j])=>{const x=$('#b-'+j);j===k?x.setAttribute('aria-current','page'):x.removeAttribute('aria-current')});
b.classList.add('vi');pill(b);F.burst(r.left+r.width/2,r.top,30);vis.add(k);if(vis.size===T.length)$('#b-fin').hidden=false}
addEventListener('resize',()=>{const a=document.querySelector('#nav [aria-current]');a&&pill(a)});
/* intro cinematográfico */
for(let i=0;i<90;i++){const s=document.createElement('i');s.className='s';s.style.cssText=`left:${Math.random()*100}%;top:${Math.random()*100}%;--t:${2+Math.random()*4}s;animation-delay:${-Math.random()*5}s`;$('#sp').appendChild(s)}
let skip=0,cancel=()=>{},rev=0,iv;const sl=ms=>new Promise(r=>{if(skip)return r();const t=setTimeout(r,ms);cancel=()=>{clearTimeout(t);r()}});
async function say(t,ms,big){const e=$('#tx');e.textContent=t;e.className='t'+(big?' c':'');void e.offsetWidth;e.classList.add('on');await sl(ms);e.classList.remove('on');await sl(800)}
function reveal(){if(rev)return;rev=1;$('#tx').className='t';$('#sk').hidden=true;const n=$('#nm');n.innerHTML=[...'Laura'].map((c,i)=>`<span style="--i:${i}">${c}</span>`).join('');n.classList.add('on');
setTimeout(()=>n.classList.add('g'),1800);setTimeout(()=>$('#hb').classList.add('on'),1200);for(let i=0;i<9;i++)setTimeout(R,i*450);setTimeout(()=>$('#go').classList.add('on'),2600)}
async function intro(){await sl(700);await say('Hoy el cielo amaneció distinto…',2700);await say('porque hoy nació alguien muy especial.',3000);
for(const n of[3,2,1]){F.burst(innerWidth/2,innerHeight/2,45);await say(n,650,1)}reveal()}
$('#sk').onclick=()=>{skip=1;cancel();reveal()};intro();
$('#go').onclick=()=>{$('#sp').classList.add('x');$('#nav').classList.add('in');for(let i=0;i<4;i++)setTimeout(R,i*250);setTimeout(()=>ir('carta'),500)};
$('#b-fin').onclick=()=>{$('#fi').classList.remove('x');R();iv=setInterval(R,500)};$('#ce').onclick=()=>{$('#fi').classList.add('x');clearInterval(iv)};
</script></body></html>
